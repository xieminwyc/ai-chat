services:
  redis:
    image: redis:7-alpine
    # Redis 只给内部网络使用，不对公网暴露 6379
    # 本地开发时可以取消下面的 ports 注释来连接
    # ports:
    #   - "6379:6379"
    restart: unless-stopped
    command:
      # 开启 AOF，至少把限流/缓存状态和未来可能扩展的轻量数据持久化到磁盘。
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-chat:
    # 线上镜像地址：CI 构建后推送到阿里云 ACR，服务器从这里 pull
    # 本地测试时可临时改成 ai-chat:local
    image: crpi-y387mtxqhofw4ibe.cn-guangzhou.personal.cr.aliyuncs.com/xieminwyc/ai-chat:latest
    # 容器崩溃自动重启，除非手动执行 docker compose stop
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口，外部通过 3000 访问容器内的 3000
      - "3000:3000"
    env_file:
      # 从服务器本地的 .env.production 注入真实数据库密钥和 AI 密钥
      - .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 每隔一段时间请求这个接口，能通则认为应用健康
      test:
        ["CMD", "wget", "-qO-", "http://localhost:3000/api/chat?action=health"]
      interval: 30s # 每 30 秒检查一次
      timeout: 10s # 超过 10 秒没响应算失败
      retries: 3 # 连续失败 3 次才标记为 unhealthy
      start_period: 10s # 启动后等 10 秒再开始检查（留时间给应用初始化）

  worker:
    # Worker 处理异步任务（邮件发送等）
    image: crpi-y387mtxqhofw4ibe.cn-guangzhou.personal.cr.aliyuncs.com/xieminwyc/ai-chat:latest
    command: ["node", "scripts/worker.mjs"]
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    # Worker 不需要暴露端口，只需内部网络访问 Redis 和数据库

volumes:
  redis-data:
